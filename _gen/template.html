<!DOCTYPE html>
<html lang="zh-Hant" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>遊戲生成提示詞圖鑑 ｜ %%TOTAL%% 組</title>
<script>
/* 主題：在第一次繪製前套用，避免閃白。gp_theme = 'dark' | 'light'；沒設定就跟隨系統。 */
(function(){try{var t=localStorage.getItem('gp_theme');if(t!=='dark'&&t!=='light'){t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';}document.documentElement.dataset.theme=t;}catch(e){}})();
</script>
<style>
/* ═══════════════════════════════════════════════════════════════
   1. 設計 token —— 深色為預設，淺色只覆寫顏色
   ═══════════════════════════════════════════════════════════════ */
:root{
  --bg:#0b1020; --bg-2:#0e1630; --panel:#131c3a; --panel-2:#1a2450; --panel-3:#090f24;
  --line:#ffffff1a; --line-2:#ffffff33;
  --txt:#eef2ff; --txt-2:#cdd6f4; --mut:#97a3c7;
  --acc1:#8b5cf6; --acc2:#22d3ee;
  --brand:linear-gradient(90deg,#7c3aed,#0284c7);
  --brand-text:linear-gradient(90deg,#a78bfa,#22d3ee);
  --on-brand:#ffffff;
  --ok:#34d399; --warn:#fbbf24; --err:#f87171; --info:#60a5fa;
  --glow1:#8b5cf636; --glow2:#22d3ee2e;
  --shadow:0 24px 70px -24px #000d;
  --sticky:#0b1020e6;
  --r-sm:8px; --r:12px; --r-lg:16px;
  --ease:cubic-bezier(.23,1,.32,1); --ease-drawer:cubic-bezier(.32,.72,0,1);
  --dur:160ms; --dur-drawer:260ms;
  --font:"Noto Sans TC","Noto Sans SC","Noto Sans JP","Noto Sans KR","PingFang TC","Microsoft JhengHei","Hiragino Sans","Yu Gothic UI","Malgun Gothic",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Cascadia Code","JetBrains Mono",Consolas,ui-monospace,monospace;
}
:root[data-theme="light"]{
  --bg:#f3f5fb; --bg-2:#ffffff; --panel:#ffffff; --panel-2:#eceff8; --panel-3:#f7f8fc;
  --line:#0b102016; --line-2:#0b102030;
  --txt:#161b30; --txt-2:#3a4368; --mut:#5f6889;
  --brand-text:linear-gradient(90deg,#6d28d9,#0e7490);
  --glow1:#8b5cf624; --glow2:#22d3ee26;
  --shadow:0 24px 70px -30px #0b102055;
  --sticky:#f3f5fbe8;
}
/* ═══════════════════════════════════════════════════════════════
   2. 基底
   ═══════════════════════════════════════════════════════════════ */
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--font);color:var(--txt);min-height:100vh;line-height:1.6;
  background:radial-gradient(1200px 520px at 12% -6%,var(--glow1),transparent 70%),
             radial-gradient(1000px 520px at 92% -2%,var(--glow2),transparent 70%),var(--bg);
  -webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc2);outline-offset:2px;border-radius:6px}
mark{background:#fbbf2466;color:inherit;border-radius:3px;padding:0 1px}
[hidden]{display:none!important}
.spacer{flex:1}
.link{background:none;border:none;color:var(--acc2);padding:0;font-size:inherit;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.link:hover{opacity:.85}
/* ═══════════════════════════════════════════════════════════════
   3. 頂欄 / Hero
   ═══════════════════════════════════════════════════════════════ */
.top{max-width:1220px;margin:0 auto;padding:18px 24px 0;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top h1{margin:0;font-size:clamp(22px,3vw,30px);letter-spacing:.02em;white-space:nowrap}
.top h1 .grad{background:var(--brand-text);-webkit-background-clip:text;background-clip:text;color:transparent}
.top-actions{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto;align-items:center}
select.lang{width:auto;padding:8px 30px 8px 12px;font-size:13px;border-radius:10px;background-color:var(--panel-2);-webkit-appearance:none;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);
  background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.hero{max-width:1220px;margin:0 auto;padding:10px 24px 4px}
.hero .lead{color:var(--mut);margin:4px 0 14px;font-size:14.5px;max-width:820px}
.hero .lead b{color:var(--txt)}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 16px;min-width:108px}
.stat b{font-size:22px;display:block;line-height:1.2}
.stat span{color:var(--mut);font-size:12px}
/* ═══════════════════════════════════════════════════════════════
   4. 按鈕 / 表單控件
   ═══════════════════════════════════════════════════════════════ */
.btn{border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:14px;cursor:pointer;
  background:var(--panel-2);color:var(--txt);text-decoration:none;display:inline-flex;align-items:center;gap:6px;
  line-height:1.3;transition:border-color var(--dur) var(--ease),background var(--dur) var(--ease),transform var(--dur) var(--ease);white-space:nowrap}
.btn:hover{border-color:var(--line-2);background:var(--panel)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
.btn.pri{background:var(--brand);border-color:transparent;color:var(--on-brand);font-weight:700}
.btn.pri:hover{filter:brightness(1.1)}
.btn.danger{color:var(--err);border-color:#f8717155}
.btn.danger:hover{background:#f8717118}
.btn.icon{padding:8px 10px;min-width:38px;justify-content:center}
.iconbtn{border:1px solid var(--line);background:var(--panel-2);color:var(--txt);border-radius:8px;padding:5px 9px;cursor:pointer;font-size:13px;white-space:nowrap;line-height:1.3;transition:border-color var(--dur) var(--ease)}
.iconbtn:hover{border-color:var(--acc2)}
.iconbtn.danger{color:var(--err)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel-2)}
.seg button{border:none;background:none;padding:7px 12px;font-size:13px;color:var(--mut);cursor:pointer}
.seg button.on{background:var(--panel);color:var(--txt);font-weight:700}
.seg button:focus-visible{outline-offset:-2px}
input[type=text],input[type=search],input[type=password],input[type=url],select,textarea{
  width:100%;background:var(--bg-2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px 12px;font-size:14px;outline:none;
  transition:border-color var(--dur) var(--ease)}
input:focus,select:focus,textarea:focus{border-color:var(--acc2)}
select option{background:var(--bg-2);color:var(--txt)}
textarea{min-height:130px;resize:vertical;line-height:1.65}
textarea.tall{min-height:260px;font-size:13.5px}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:13px;color:var(--mut);margin-bottom:6px}
.fld .hint,.hint{font-size:12px;color:var(--mut);margin-top:5px;line-height:1.7}
.hint-inline{font-weight:400;opacity:.85}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.grid2 .span2{grid-column:1/-1}
.row-inline{display:flex;gap:8px;align-items:center}
.row-inline>*:first-child{flex:1}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.m-hint{font-size:12.5px;color:var(--mut);line-height:1.7;background:var(--bg-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:14px}
.m-hint.ok{border-color:#34d39955;color:var(--txt-2)}
.m-hint.warn{border-color:#fbbf2455}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid var(--acc2);color:var(--acc2);vertical-align:2px;margin-left:6px;font-weight:600}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mut);margin-right:5px;vertical-align:1px}
.dot.ok{background:var(--ok)}
h3.sec{font-size:13px;color:var(--mut);margin:18px 0 8px;font-weight:600;letter-spacing:.04em}
h3.sec:first-child{margin-top:0}
/* ═══════════════════════════════════════════════════════════════
   5. 控制列（sticky）
   ═══════════════════════════════════════════════════════════════ */
.controls{max-width:1220px;margin:14px auto 0;padding:10px 24px;position:sticky;top:0;z-index:5;
  background:var(--sticky);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.search{display:flex;gap:8px;margin-bottom:10px;align-items:center;flex-wrap:wrap}
.search input{flex:1 1 260px;padding:11px 14px;font-size:15px;border-radius:12px;min-width:0}
.search select{width:auto;padding:9px 32px 9px 12px;font-size:13px;-webkit-appearance:none;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);
  background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--bg-2);color:var(--txt);border-radius:999px;
  padding:6px 13px;font-size:13px;cursor:pointer;transition:border-color var(--dur) var(--ease),background var(--dur) var(--ease);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:var(--acc2)}
.chip.on{background:var(--brand);border-color:transparent;color:var(--on-brand);font-weight:700}
.chip .n{opacity:.75;font-size:12px}
.chip .sw{width:8px;height:8px;border-radius:50%;background:var(--bc)}
.chip.on .sw{background:#fff}
/* ═══════════════════════════════════════════════════════════════
   6. 清單（表格 / 卡片）
   ═══════════════════════════════════════════════════════════════ */
.wrap{max-width:1220px;margin:0 auto;padding:16px 24px 40px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.count{padding:11px 18px;color:var(--mut);font-size:13px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.tablebox{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:820px}
thead th{position:sticky;top:0;text-align:left;font-size:12px;color:var(--mut);font-weight:600;
  padding:11px 14px;border-bottom:1px solid var(--line);background:var(--panel-2);white-space:nowrap;z-index:1}
thead th[data-sort]{cursor:pointer;user-select:none}
thead th[data-sort]:hover{color:var(--txt)}
thead th.sorted::after{content:" ↓";color:var(--acc2)}
tbody td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}
tbody tr{cursor:pointer;transition:background var(--dur) var(--ease)}
tbody tr:hover,tbody tr:focus-visible{background:#8b5cf61f;outline:none}
tbody tr:focus-visible td:first-child{box-shadow:inset 3px 0 0 var(--acc2)}
tbody tr.cur{background:#22d3ee14}
td.num{color:var(--mut);width:44px;font-variant-numeric:tabular-nums}
td .nm{font-weight:600}
td .slug{font-size:11px;color:var(--mut);font-family:var(--mono);margin-top:2px}
.badge{display:inline-block;padding:3px 11px;border-radius:999px;font-size:12px;font-weight:700;
  color:#0b1020;background:var(--bc,#38bdf8);white-space:nowrap}
td .core{color:var(--txt-2);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
td .insp{font-size:12.5px;color:var(--mut)}
td.favcell{width:44px;text-align:center}
.star{background:none;border:none;font-size:18px;line-height:1;color:var(--mut);padding:2px 6px;border-radius:6px;cursor:pointer;transition:transform var(--dur) var(--ease),color var(--dur) var(--ease)}
.star:hover{transform:scale(1.2);color:var(--warn)}
.star.on{color:var(--warn)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;padding:14px}
.gcard{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;
  transition:border-color var(--dur) var(--ease),transform var(--dur) var(--ease)}
.gcard:hover,.gcard:focus-visible{border-color:var(--acc2);transform:translateY(-2px)}
.gcard .gc-top{display:flex;align-items:center;gap:8px}
.gcard h3{margin:0;font-size:15px;line-height:1.35}
.gcard .gc-hero{font-size:12.5px;color:var(--mut)}
.gcard .gc-core{margin:0;font-size:13px;color:var(--txt-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.gcard .gc-insp{font-size:12px;color:var(--mut);margin-top:auto;padding-top:4px}
.card[data-view="table"] .grid{display:none}
.card[data-view="cards"] .tablebox{display:none}
@media (max-width:760px){.card[data-view="auto"] .tablebox{display:none}}
@media (min-width:761px){.card[data-view="auto"] .grid{display:none}}
.empty{padding:44px 20px;text-align:center;color:var(--mut);line-height:1.8}
.empty b{color:var(--txt)}
/* ═══════════════════════════════════════════════════════════════
   7. 抽屜（全文）—— 簽名元素：9 段步驟軌
   ═══════════════════════════════════════════════════════════════ */
.scrim{position:fixed;inset:0;background:#000a;z-index:15;opacity:0;pointer-events:none;transition:opacity var(--dur-drawer) var(--ease)}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100dvh;width:min(720px,100%);z-index:20;outline:none;
  background:var(--bg-2);border-left:1px solid var(--line);transform:translateX(105%);transition:transform var(--dur-drawer) var(--ease-drawer);
  display:flex;flex-direction:column;box-shadow:var(--shadow)}
.drawer.open{transform:none}
.d-head{padding:14px 22px 12px;border-bottom:1px solid var(--line)}
.d-nav{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.d-pos{font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums;margin-left:4px}
.d-head h2{margin:0 0 6px;font-size:22px;line-height:1.3}
.d-head .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.d-head .slug{font-family:var(--mono);color:var(--mut);font-size:12px}
.meta{display:grid;grid-template-columns:max-content 1fr;gap:5px 14px;font-size:13px;margin:0;
  padding:12px 22px;border-bottom:1px solid var(--line);color:var(--txt-2)}
.meta dt{color:var(--mut)}
.meta dd{margin:0}
.d-actions{display:flex;gap:8px;padding:12px 22px;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center}
.d-progress{display:flex;align-items:center;gap:10px;padding:9px 22px;border-bottom:1px solid var(--line);font-size:12px;color:var(--mut)}
.d-progress .bar{flex:1;height:6px;background:var(--panel-2);border-radius:99px;overflow:hidden}
.d-progress .bar i{display:block;height:100%;width:0;background:var(--brand);transition:width .25s var(--ease)}
.d-body{flex:1;overflow:auto;padding:16px 22px;overscroll-behavior:contain}
.d-body pre{white-space:pre-wrap;word-break:break-word;background:var(--panel-3);border:1px solid var(--line);
  border-radius:12px;padding:16px;font-size:13.5px;line-height:1.75;margin:0;font-family:inherit}
.intro{font-size:14px;font-weight:600;margin:0 0 12px;line-height:1.6}
.step{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:8px 12px;align-items:start;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel-3);margin-bottom:10px;
  transition:border-color var(--dur) var(--ease)}
.step:hover{border-color:var(--line-2)}
.step .n{width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;font-weight:700;display:grid;place-items:center;font-size:13px}
.step.done .n{background:var(--ok);color:#0b1020}
.step.done .tx{opacity:.7}
.step .body{min-width:0}
.step .lb{font-size:12px;color:var(--mut);margin-bottom:3px;font-weight:600}
.step .tx{font-size:13.5px;line-height:1.75;white-space:pre-wrap;word-break:break-word}
.step .act{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.chk{font-size:12px;color:var(--mut);display:inline-flex;align-items:center;gap:4px;cursor:pointer;white-space:nowrap}
.chk input{accent-color:var(--acc2);margin:0}
.d-foot{padding:10px 22px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.d-foot:empty{display:none}
/* ═══════════════════════════════════════════════════════════════
   8. Modal / Toast
   ═══════════════════════════════════════════════════════════════ */
.modal{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;padding:20px;background:#0009}
.modal.open{display:flex}
.modal .box{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r-lg);width:min(720px,100%);max-height:90dvh;display:flex;flex-direction:column;box-shadow:var(--shadow);
  animation:pop .2s var(--ease)}
.modal .box.wide{width:min(860px,100%)}
.modal .box.narrow{width:min(440px,100%)}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
.m-head{padding:16px 22px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.m-head h2{margin:0;font-size:18px;flex:1}
.m-head .phase{font-size:12px;color:var(--mut);background:var(--panel-2);border-radius:999px;padding:3px 10px;white-space:nowrap}
.m-body{padding:16px 22px;overflow:auto;overscroll-behavior:contain}
.m-foot{padding:12px 22px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.modellist{display:flex;flex-direction:column;gap:8px}
.modelrow{display:flex;gap:8px;align-items:center;background:var(--bg-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px}
.modelrow .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.modelrow .pv{color:var(--mut);font-size:12px;white-space:nowrap}
.genlog{background:var(--panel-3);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.7;white-space:pre-wrap;word-break:break-word;max-height:200px;overflow:auto;color:var(--txt-2)}
.genlog.busy::before{content:"";display:inline-block;width:12px;height:12px;border:2px solid var(--acc2);border-top-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.drop{border:1px dashed var(--line-2);border-radius:10px;padding:14px;text-align:center;font-size:13px;color:var(--mut);transition:border-color var(--dur) var(--ease),background var(--dur) var(--ease)}
.drop.over{border-color:var(--acc2);background:#22d3ee12}
details.fld summary{cursor:pointer;font-size:13px;color:var(--mut);margin-bottom:6px}
.keyrow{display:flex;gap:8px}
.keyrow input{flex:1;min-width:0}
.toasts{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(520px,calc(100% - 32px))}
.toast{background:var(--panel-2);color:var(--txt);border:1px solid var(--line-2);padding:9px 18px;border-radius:999px;font-size:13.5px;box-shadow:var(--shadow);
  animation:tin .22s var(--ease);max-width:100%;text-align:center}
.toast.ok{border-color:#34d39977}
.toast.err{border-color:#f8717199;background:#3a1420;color:#fecaca}
:root[data-theme="light"] .toast.err{background:#fee2e2;color:#7f1d1d}
.toast.out{animation:tout .2s var(--ease) forwards}
@keyframes tin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateY(8px)}}
footer{max-width:1220px;margin:0 auto;padding:0 24px 40px;color:var(--mut);font-size:12px;line-height:1.9}
kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--panel-2);color:var(--txt)}
/* ═══════════════════════════════════════════════════════════════
   9. 響應式 / 無障礙
   ═══════════════════════════════════════════════════════════════ */
@media (max-width:760px){
  .top{padding:14px 16px 0}
  .top-actions{margin-left:0;width:100%}
  .top-actions .btn{flex:1 1 auto;justify-content:center}
  .top-actions .btn.icon{flex:0 0 auto}
  .top-actions select.lang{flex:1 1 auto}
  .hero,.controls,.wrap,footer{padding-left:16px;padding-right:16px}

}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}

<script id="gamedata" type="application/json">%%DATA%%</script>
<script src="assets/i18n.js?v=%%VER%%"></script>
<script>
/* ═══════════════════════════════════════════════════════════════
   1. 常數
   ═══════════════════════════════════════════════════════════════ */
const BUILD_DATE = '%%DATE%%';
const LS = { theme:'gp_theme', lang:'gp_lang', favs:'gp_favs', prog:'gp_progress', view:'gp_view', sort:'gp_sort', mode:'gp_step_mode' };
const CAT_COLORS = {'動作冒險':'#38bdf8','Roguelike・RPG':'#fb7185','模擬經營':'#fbbf24','策略戰棋':'#a78bfa','競速・運動':'#fb923c','恐怖・懸疑':'#94a3b8','敘事・解謎':'#2dd4bf','休閒・療癒':'#a3e635','音樂・節奏':'#e879f9'};
const ALL = 'all', FAV = 'fav';   // 內部篩選鍵（網址用），顯示文字走 i18n

/* ═══════════════════════════════════════════════════════════════
   2. 工具函式
   ═══════════════════════════════════════════════════════════════ */
const $ = id => document.getElementById(id);
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function debounce(fn, ms){ let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
const store = {
  get(k, def){ try { const v = localStorage.getItem(k); return v == null ? def : JSON.parse(v); } catch { return def; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; }
    catch { toast(t('toast.full'), 'err'); return false; } },
  del(k){ try { localStorage.removeItem(k); } catch {} },
};
function download(name, text, type = 'text/plain;charset=utf-8'){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
async function copyText(txt, msg){
  try { await navigator.clipboard.writeText(txt); }
  catch {
    const ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch { ta.remove(); toast(t('toast.copyFail'), 'err'); return false; }
    ta.remove();
  }
  toast(msg || t('toast.copied'), 'ok'); return true;
}
function catColor(c){
  if (CAT_COLORS[c]) return CAT_COLORS[c];
  let h = 0; for (const ch of String(c)) h = (h * 31 + ch.codePointAt(0)) % 360;
  return `hsl(${h} 70% 68%)`;
}
function badgeStyle(c){ return `--bc:${catColor(c)}`; }

/* ═══════════════════════════════════════════════════════════════
   3. i18n —— 介面五語系；分類鍵值與提示詞內容不翻
   ═══════════════════════════════════════════════════════════════ */
const I18N = window.GP_I18N || { langs: [{ code: 'zh-TW', name: '繁體中文', html: 'zh-Hant' }], cats: {}, dict: { 'zh-TW': {} } };
let lang = detectLang();
function detectLang(){
  try { const s = localStorage.getItem(LS.lang); if (s && I18N.dict[s]) return s; } catch {}
  const n = (navigator.language || 'en').toLowerCase();
  if (n.startsWith('zh')) return /tw|hk|mo|hant/.test(n) ? 'zh-TW' : 'zh-CN';
  if (n.startsWith('ja')) return 'ja';
  if (n.startsWith('ko')) return 'ko';
  return I18N.dict.en ? 'en' : 'zh-TW';
}
function t(key, vars){
  let s = I18N.dict[lang]?.[key] ?? I18N.dict['zh-TW']?.[key] ?? key;
  if (vars) for (const [k, v] of Object.entries(vars)) s = s.split('{' + k + '}').join(v);
  return s;
}
function catLabel(c){ if (c === ALL) return t('chip.all'); if (c === FAV) return t('chip.fav'); return I18N.cats[c]?.[lang] || c; }
function applyLang(){
  const meta = I18N.langs.find(l => l.code === lang); document.documentElement.lang = meta?.html || lang;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.innerHTML = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
  document.querySelectorAll('[data-i18n-title]').forEach(el => { const s = t(el.dataset.i18nTitle); el.title = s; el.setAttribute('aria-label', s); });
  document.querySelectorAll('[data-i18n-aria]').forEach(el => { el.setAttribute('aria-label', t(el.dataset.i18nAria)); });
  $('langSel').value = lang;
  $('lead').innerHTML = t('hero.lead', { n: `<b id="stTotalInline">${DATA.length}</b>`, date: BUILD_DATE });
  applyTheme(document.documentElement.dataset.theme || 'dark');
  refreshAll();
  if (cur) openDrawer(cur.slug);
  window.dispatchEvent(new CustomEvent('gp:lang', { detail: { lang } }));
}
function setLang(code){
  if (!I18N.dict[code]) return;
  lang = code; try { localStorage.setItem(LS.lang, code); } catch {}
  applyLang();
}
$('langSel').innerHTML = I18N.langs.map(l => `<option value="${esc(l.code)}">${esc(l.name)}</option>`).join('');
$('langSel').addEventListener('change', e => setLang(e.target.value));

/* ═══════════════════════════════════════════════════════════════
   4. 資料模型 + normalize（所有進入 UI 的資料都先過這裡）
   ═══════════════════════════════════════════════════════════════ */
function normalize(raw){
  const r = raw && typeof raw === 'object' ? raw : {};
  const s = k => String(r[k] ?? '').trim();
  const slug = s('slug').toLowerCase().replace(/[^a-z0-9-]+/g, '-').replace(/^-+|-+$/g, '') || 'untitled';
  const d = {
    slug,
    name: s('name') || slug.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' '),
    cat: s('cat') || '動作冒險',
    core: s('core'), hero: s('hero'), concept: s('concept'), atmo: s('atmo'), sys: s('sys'),
    system: s('system'), world: s('world'),
    prompt: String(r.prompt ?? '').replace(/\r\n?/g, '\n'),
    file: s('file') || ('prompts/' + slug + '.txt'),
    custom: !!r.custom, local: !!r.local,
  };
  d.hay = [d.slug, d.name, d.cat, d.core, d.hero, d.concept, d.atmo, d.sys, d.system, d.world, d.prompt].join('\n').toLowerCase();
  return d;
}
function parseSteps(prompt){
  const parts = String(prompt || '').split(/\n(?=\s*\d{1,2}[.、．]\S)/);
  const intro = [], steps = [];
  for (const p of parts){
    const m = p.match(/^\s*(\d{1,2})[.、．]\s*([\s\S]*)$/);
    if (m) steps.push({ n: +m[1], text: m[2].trim() });
    else if (!steps.length && p.trim()) intro.push(p.trim());
  }
  return { intro: intro.join('\n'), steps };
}
const DATA = JSON.parse($('gamedata').textContent).map(normalize);

/* ═══════════════════════════════════════════════════════════════
   5. 狀態 + URL 同步（#cat=…&q=…&p=slug 可直接分享）
   ═══════════════════════════════════════════════════════════════ */
const state = { cat: ALL, q: '', sort: store.get(LS.sort, 'default'), view: store.get(LS.view, 'auto'), mode: store.get(LS.mode, 'steps') };
const favs = new Set(store.get(LS.favs, []));
let prog = store.get(LS.prog, {}); if (!prog || typeof prog !== 'object') prog = {};
let cur = null, lastList = [], lastFocus = null;
function readHash(){
  const p = new URLSearchParams(location.hash.slice(1));
  state.cat = p.get('cat') || ALL; state.q = p.get('q') || '';
  return p.get('p');
}
function writeHash(){
  const p = new URLSearchParams();
  if (state.cat !== ALL) p.set('cat', state.cat);
  if (state.q) p.set('q', state.q);
  if (cur) p.set('p', cur.slug);
  const h = p.toString();
  try { history.replaceState(null, '', h ? '#' + h : location.pathname + location.search); }
  catch { if (h || location.hash) location.hash = h; }
}

/* ═══════════════════════════════════════════════════════════════
   6. 渲染：chips / 表格 / 卡片 / 統計
   ═══════════════════════════════════════════════════════════════ */
const rows = $('rows'), cards = $('cards'), chips = $('chips'), countEl = $('count');
function cats(){ return [...new Set(DATA.map(d => d.cat))].sort((a, b) => catLabel(a).localeCompare(catLabel(b), lang)); }
function tokens(){ return state.q.toLowerCase().split(/\s+/).filter(Boolean); }
function filtered(){
  const toks = tokens();
  const list = DATA.filter(d => {
    if (state.cat === FAV) { if (!favs.has(d.slug)) return false; }
    else if (state.cat !== ALL && d.cat !== state.cat) return false;
    if (!toks.length) return true;
    const label = catLabel(d.cat).toLowerCase();
    return toks.every(tk => d.hay.includes(tk) || label.includes(tk));
  });
  const c = (a, b) => a.localeCompare(b, 'en');
  switch (state.sort){
    case 'name': return list.sort((a, b) => c(a.name, b.name));
    case 'cat': return list.sort((a, b) => catLabel(a.cat).localeCompare(catLabel(b.cat), lang) || c(a.name, b.name));
    case 'hero': return list.sort((a, b) => c(a.hero, b.hero) || c(a.name, b.name));
    case 'custom': return list.sort((a, b) => ((b.custom || b.local) - (a.custom || a.local)) || c(a.slug, b.slug));
    default: return list.sort((a, b) => c(a.slug, b.slug));
  }
}
function hl(text, toks){
  const s = String(text ?? '');
  if (!toks.length) return esc(s);
  const re = new RegExp('(' + toks.map(tk => tk.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'ig');
  return s.split(re).map((piece, i) => i % 2 ? '<mark>' + esc(piece) + '</mark>' : esc(piece)).join('');
}
function renderChips(){
  const all = [{ c: ALL, n: DATA.length }]
    .concat(cats().map(c => ({ c, n: DATA.filter(d => d.cat === c).length })))
    .concat(favs.size ? [{ c: FAV, n: favs.size }] : []);
  chips.innerHTML = all.map(o =>
    `<button class="chip${o.c === state.cat ? ' on' : ''}" role="tab" aria-selected="${o.c === state.cat}" data-c="${esc(o.c)}" style="${o.c === ALL || o.c === FAV ? '' : badgeStyle(o.c)}">` +
    `${o.c === ALL || o.c === FAV ? '' : '<span class="sw"></span>'}${esc(catLabel(o.c))} <span class="n">${o.n}</span></button>`).join('');
}
function updateStats(){
  $('stTotal').textContent = DATA.length; const inl = $('stTotalInline'); if (inl) inl.textContent = DATA.length;
  $('stCat').textContent = cats().length;
  $('stCustom').textContent = DATA.filter(d => d.custom || d.local).length;
  $('stFav').textContent = favs.size;
  document.title = t('app.title', { n: DATA.length });
}
function tagOf(d){ return d.custom || d.local ? ` <span class="tag">${esc(t(d.local ? 'tag.local' : 'tag.custom'))}</span>` : ''; }
function starBtn(d){ const on = favs.has(d.slug); return `<button class="star${on ? ' on' : ''}" data-fav="${esc(d.slug)}" aria-label="${esc(t(on ? 'fav.remove' : 'fav.add'))}" aria-pressed="${on}">${on ? '★' : '☆'}</button>`; }
function render(){
  const list = filtered(); lastList = list; const toks = tokens();
  const active = state.cat !== ALL || state.q;
  countEl.textContent = t('count', { n: list.length, total: DATA.length }) + (state.cat !== ALL ? '・' + catLabel(state.cat) : '') + (state.q ? '・' + t('count.q', { q: state.q }) : '');
  $('btnClear').hidden = !active;
  rows.innerHTML = list.length ? list.map((d, i) =>
    `<tr tabindex="0" data-slug="${esc(d.slug)}"${cur && cur.slug === d.slug ? ' class="cur"' : ''}>
      <td class="num">${i + 1}</td>
      <td><div class="nm">${hl(d.name, toks)}${tagOf(d)}</div><div class="slug">${esc(d.slug)}.txt</div></td>
      <td><span class="badge" style="${badgeStyle(d.cat)}">${esc(catLabel(d.cat))}</span></td>
      <td>${hl(d.hero, toks)}</td>
      <td><div class="core">${hl(d.core, toks)}</div></td>
      <td><div class="insp">${hl(d.atmo, toks)} × ${hl(d.sys, toks)}</div></td>
      <td class="favcell">${starBtn(d)}</td>
    </tr>`).join('')
    : `<tr><td colspan="7"><div class="empty">${emptyMsg()}</div></td></tr>`;
  cards.innerHTML = list.length ? list.map(d =>
    `<article class="gcard" tabindex="0" data-slug="${esc(d.slug)}">
      <div class="gc-top"><span class="badge" style="${badgeStyle(d.cat)}">${esc(catLabel(d.cat))}</span><span class="spacer"></span>${starBtn(d)}</div>
      <h3>${hl(d.name, toks)}${tagOf(d)}</h3>
      <div class="gc-hero">${esc(t('m.hero'))}：${hl(d.hero, toks)}</div>
      <p class="gc-core">${hl(d.core, toks)}</p>
      <div class="gc-insp">${hl(d.atmo, toks)} × ${hl(d.sys, toks)}</div>
    </article>`).join('')
    : `<div class="empty">${emptyMsg()}</div>`;
  document.querySelectorAll('thead th[data-sort]').forEach(th => th.classList.toggle('sorted', th.dataset.sort === state.sort));
}
function emptyMsg(){
  if (state.cat === FAV && !favs.size) return t('empty.fav');
  return state.q ? t('empty.q', { q: esc(state.q) }) : t('empty.none');
}
function refreshAll(){ renderChips(); render(); updateStats(); }

/* ─── 事件（委派，只綁一次）─── */
function onListClick(e){
  const star = e.target.closest('[data-fav]');
  if (star){ e.stopPropagation(); toggleFav(star.dataset.fav); return; }
  if (e.target.closest('[data-act="clear"]')){ clearFilters(); return; }
  const it = e.target.closest('[data-slug]'); if (it) openDrawer(it.dataset.slug);
}
function onListKey(e){
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const it = e.target.closest('[data-slug]'); if (!it || e.target !== it) return;
  e.preventDefault(); openDrawer(it.dataset.slug);
}
rows.addEventListener('click', onListClick); cards.addEventListener('click', onListClick);
rows.addEventListener('keydown', onListKey); cards.addEventListener('keydown', onListKey);
chips.addEventListener('click', e => { const b = e.target.closest('.chip'); if (!b) return; state.cat = b.dataset.c; renderChips(); render(); writeHash(); });
$('q').addEventListener('input', debounce(e => { state.q = e.target.value; render(); writeHash(); }, 80));
$('btnClear').addEventListener('click', clearFilters);
function clearFilters(){ state.cat = ALL; state.q = ''; $('q').value = ''; renderChips(); render(); writeHash(); }
$('sort').value = state.sort;
$('sort').addEventListener('change', e => { state.sort = e.target.value; store.set(LS.sort, state.sort); render(); });
document.querySelectorAll('thead th[data-sort]').forEach(th => th.addEventListener('click', () => {
  state.sort = state.sort === th.dataset.sort ? 'default' : th.dataset.sort; $('sort').value = state.sort; store.set(LS.sort, state.sort); render();
}));
const mqNarrow = matchMedia('(max-width:760px)');
function applyView(){
  $('listCard').dataset.view = state.view;
  const eff = state.view === 'auto' ? (mqNarrow.matches ? 'cards' : 'table') : state.view;
  $('viewSeg').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.view === eff));
}
$('viewSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; state.view = b.dataset.view; store.set(LS.view, state.view); applyView(); });
mqNarrow.addEventListener('change', applyView);
$('btnRandom').addEventListener('click', () => {
  const list = lastList.length ? lastList : DATA;
  if (!list.length) return toast(t('toast.noRandom'), 'err');
  openDrawer(list[Math.floor(Math.random() * list.length)].slug);
});

/* ═══════════════════════════════════════════════════════════════
   7. 收藏 / 進度
   ═══════════════════════════════════════════════════════════════ */
function toggleFav(slug){
  if (favs.has(slug)) favs.delete(slug); else favs.add(slug);
  store.set(LS.favs, [...favs]);
  if (state.cat === FAV && !favs.size) state.cat = ALL;
  refreshAll();
  if (cur && cur.slug === slug) syncFavBtn();
  toast(t(favs.has(slug) ? 'toast.favOn' : 'toast.favOff'), 'ok');
}
function syncFavBtn(){ const on = favs.has(cur.slug); const b = $('dFav'); b.textContent = on ? '★' : '☆'; b.setAttribute('aria-pressed', on); b.style.color = on ? 'var(--warn)' : ''; }
function setDone(slug, n, on){
  const set = new Set(prog[slug] || []); if (on) set.add(n); else set.delete(n);
  if (set.size) prog[slug] = [...set].sort((a, b) => a - b); else delete prog[slug];
  store.set(LS.prog, prog);
}

/* ═══════════════════════════════════════════════════════════════
   8. 抽屜
   ═══════════════════════════════════════════════════════════════ */
const drawer = $('drawer'), scrim = $('scrim');
let lockCount = 0;
function lockBody(){ lockCount++; document.body.classList.add('lock'); }
function unlockBody(){ lockCount = Math.max(0, lockCount - 1); if (!lockCount) document.body.classList.remove('lock'); }
function openDrawer(slug){
  const d = DATA.find(x => x.slug === slug);
  if (!d) return toast(t('toast.notFound', { slug }), 'err');
  const wasOpen = drawer.classList.contains('open');
  if (!wasOpen){ lastFocus = document.activeElement; lockBody(); }
  const same = cur && cur.slug === slug;
  cur = d;
  $('dName').textContent = d.name; $('dSlug').textContent = d.slug + '.txt';
  const b = $('dCat'); b.textContent = catLabel(d.cat); b.style.cssText = badgeStyle(d.cat);
  const tag = $('dTag'); tag.hidden = !(d.custom || d.local); tag.textContent = t(d.local ? 'tag.local' : 'tag.custom');
  $('dMeta').innerHTML =
    `<dt>${esc(t('m.hero'))}</dt><dd>${esc(d.hero)}</dd><dt>${esc(t('m.concept'))}</dt><dd>${esc(d.concept)}</dd><dt>${esc(t('m.system'))}</dt><dd>${esc(d.system)}</dd>` +
    `<dt>${esc(t('m.world'))}</dt><dd>${esc(d.world)}</dd><dt>${esc(t('m.insp'))}</dt><dd>${esc(d.atmo)} × ${esc(d.sys)}</dd>`;
  $('dPrompt').textContent = d.prompt;
  $('dFile').href = d.file; $('dFile').hidden = !!d.local;
  $('dDel').hidden = !(d.custom || d.local);
  const list = lastList.length ? lastList : DATA, idx = list.findIndex(x => x.slug === slug);
  $('dPos').textContent = idx >= 0 ? `${idx + 1} / ${list.length}` : '';
  $('dPrev').disabled = idx <= 0; $('dNext').disabled = idx < 0 || idx >= list.length - 1;
  syncFavBtn(); renderSteps();
  rows.querySelectorAll('tr.cur').forEach(tr => tr.classList.remove('cur'));
  rows.querySelector(`tr[data-slug="${CSS.escape(slug)}"]`)?.classList.add('cur');
  drawer.classList.add('open'); scrim.classList.add('on');
  if (!wasOpen) drawer.focus();
  if (!same) drawer.querySelector('.d-body').scrollTop = 0;
  writeHash();
}
function closeDrawer(){
  if (!drawer.classList.contains('open')) return;
  drawer.classList.remove('open'); scrim.classList.remove('on'); unlockBody();
  const row = cur && rows.querySelector(`tr[data-slug="${CSS.escape(cur.slug)}"]`);
  cur = null; rows.querySelectorAll('tr.cur').forEach(tr => tr.classList.remove('cur'));
  writeHash();
  // 焦點回到剛才看的那一列（鍵盤使用者不會掉到頁首）；找不到就回開啟前的元素
  if (row && row.offsetParent !== null) row.focus({ preventScroll: true });
  else if (lastFocus && lastFocus !== document.body && lastFocus !== drawer) lastFocus.focus?.();
  else drawer.blur();
  lastFocus = null;
}
function nav(delta){
  if (!cur) return;
  const list = lastList.length ? lastList : DATA; let i = list.findIndex(x => x.slug === cur.slug);
  const j = (i < 0 ? 0 : i) + delta; if (j < 0 || j >= list.length) return;
  openDrawer(list[j].slug);
}
function renderSteps(){
  const { intro, steps } = parseSteps(cur.prompt);
  const ok = steps.length >= 2;
  const done = new Set(prog[cur.slug] || []);
  $('modeSeg').hidden = !ok; $('dProg').hidden = !ok || state.mode === 'raw';
  const mode = ok ? state.mode : 'raw';
  $('modeSeg').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.mode === mode));
  $('dSteps').hidden = mode !== 'steps'; $('dPrompt').hidden = mode !== 'raw';
  if (mode !== 'steps') return;
  $('dSteps').innerHTML = (intro ? `<p class="intro">${esc(intro)}</p>` : '') + steps.map(s =>
    `<div class="step${done.has(s.n) ? ' done' : ''}" data-n="${s.n}">
      <div class="n">${s.n}</div>
      <div class="body"><div class="lb">${esc(s.n >= 1 && s.n <= 9 ? t('step.' + s.n) : t('step.n', { n: s.n }))}</div><div class="tx">${esc(s.text)}</div></div>
      <div class="act"><button class="iconbtn" data-copy="${s.n}" title="${esc(t('step.copyTitle', { n: s.n }))}">${esc(t('step.copy'))}</button>
        <label class="chk"><input type="checkbox" data-done="${s.n}"${done.has(s.n) ? ' checked' : ''}> ${esc(t('step.done'))}</label></div>
    </div>`).join('');
  const n = steps.filter(s => done.has(s.n)).length;
  $('dProg').querySelector('.bar i').style.width = (steps.length ? n / steps.length * 100 : 0) + '%';
  $('dProgText').textContent = t('d.prog', { n, total: steps.length });
}
$('dSteps').addEventListener('click', e => {
  const b = e.target.closest('[data-copy]'); if (!b) return;
  const s = parseSteps(cur.prompt).steps.find(x => x.n === +b.dataset.copy); if (!s) return;
  copyText(s.text, t('toast.copiedStep', { n: s.n }));
});
$('dSteps').addEventListener('change', e => {
  const c = e.target.closest('[data-done]'); if (!c) return;
  setDone(cur.slug, +c.dataset.done, c.checked); renderSteps();
});
$('dProgReset').addEventListener('click', () => { delete prog[cur.slug]; store.set(LS.prog, prog); renderSteps(); toast(t('toast.progReset'), 'ok'); });
$('modeSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; state.mode = b.dataset.mode; store.set(LS.mode, state.mode); renderSteps(); });
$('dClose').addEventListener('click', closeDrawer); scrim.addEventListener('click', closeDrawer);
$('dPrev').addEventListener('click', () => nav(-1)); $('dNext').addEventListener('click', () => nav(1));
$('dFav').addEventListener('click', () => cur && toggleFav(cur.slug));
$('dCopy').addEventListener('click', () => cur && copyText(cur.prompt, t('toast.copiedFull')));
$('dDl').addEventListener('click', () => cur && download(cur.slug + '.txt', cur.prompt));

/* ═══════════════════════════════════════════════════════════════
   9. Toast / Confirm / Modal（含焦點陷阱）
   ═══════════════════════════════════════════════════════════════ */
function toast(msg, kind = ''){
  const box = $('toasts'); const el = document.createElement('div');
  el.className = 'toast ' + kind; el.textContent = msg; box.appendChild(el);
  while (box.children.length > 3) box.firstChild.remove();
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 220); }, kind === 'err' ? 4200 : 2000);
}
const modalStack = [];
function openModal(id){
  const m = $(id); if (!m || m.classList.contains('open')) return;
  modalStack.push({ id, prev: document.activeElement }); m.classList.add('open'); lockBody();
  (m.querySelector('[autofocus]') || m.querySelector('input:not([type=hidden]),select,textarea,button:not([data-close])') || m).focus?.();
}
let confirmResolve = null;
function closeModal(id){
  const m = $(id); if (!m || !m.classList.contains('open')) return;
  m.classList.remove('open'); unlockBody();
  const i = modalStack.findIndex(x => x.id === id); const rec = i >= 0 ? modalStack.splice(i, 1)[0] : null;
  if (id === 'mConfirm' && confirmResolve){ const r = confirmResolve; confirmResolve = null; r(false); }
  rec?.prev?.focus?.();
}
function gpConfirm(msg, { ok, danger = false } = {}){
  return new Promise(res => {
    $('cfMsg').textContent = msg; const b = $('cfOk'); b.textContent = ok || t('ok'); b.classList.toggle('danger', danger); b.classList.toggle('pri', !danger);
    confirmResolve = res; openModal('mConfirm');
  });
}
$('cfOk').addEventListener('click', () => { const r = confirmResolve; confirmResolve = null; closeModal('mConfirm'); r?.(true); });
document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => closeModal(b.dataset.close)));
document.querySelectorAll('.modal').forEach(m => m.addEventListener('mousedown', e => { if (e.target === m) closeModal(m.id); }));
function topContainer(){ return modalStack.length ? $(modalStack[modalStack.length - 1].id) : (drawer.classList.contains('open') ? drawer : null); }
function trapTab(e){
  const c = topContainer(); if (!c) return;
  const f = [...c.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]):not([type=hidden]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])')]
    .filter(el => el.offsetParent !== null || el === c);
  if (!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if (e.shiftKey && (document.activeElement === first || document.activeElement === c)){ e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
}

/* ═══════════════════════════════════════════════════════════════
   10. 主題 / 快捷鍵
   ═══════════════════════════════════════════════════════════════ */
function applyTheme(th){
  document.documentElement.dataset.theme = th;
  const b = $('btnTheme'); b.textContent = th === 'dark' ? '🌙' : '☀️';
  b.title = t(th === 'dark' ? 'theme.toLight' : 'theme.toDark'); b.setAttribute('aria-label', b.title);
}
$('btnTheme').addEventListener('click', () => {
  const th = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  try { localStorage.setItem(LS.theme, th); } catch {} applyTheme(th);
});
matchMedia('(prefers-color-scheme: light)').addEventListener('change', e => { try { if (!localStorage.getItem(LS.theme)) applyTheme(e.matches ? 'light' : 'dark'); } catch {} });
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  const typing = ['input', 'textarea', 'select'].includes(tag) || e.target.isContentEditable;
  if (e.key === 'Tab'){ trapTab(e); return; }
  if (e.key === 'Escape'){
    if (modalStack.length){ closeModal(modalStack[modalStack.length - 1].id); return; }
    if (drawer.classList.contains('open')){ closeDrawer(); return; }
    if (e.target.id === 'q' && state.q){ clearFilters(); }
    return;
  }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); $('q').focus(); $('q').select(); return; }
  if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === '/'){ e.preventDefault(); $('q').focus(); return; }
  if (cur && !modalStack.length){
    if (e.key === 'ArrowLeft') nav(-1);
    else if (e.key === 'ArrowRight') nav(1);
    else if (e.key === 'c') copyText(cur.prompt, t('toast.copiedFull'));
    else if (e.key === 'f') toggleFav(cur.slug);
  }
});

/* ═══════════════════════════════════════════════════════════════
   11. 啟動 + 對 app-gen.js 的公開介面
   ═══════════════════════════════════════════════════════════════ */
window.GP = {
  DATA, normalize, cats, esc, store, download, copy: copyText, toast, confirm: gpConfirm,
  openModal, closeModal, open: openDrawer, close: closeDrawer, current: () => cur,
  filtered: () => filtered(), refresh: refreshAll, state, backend: { ok: false },
  t, catLabel, setLang, get lang(){ return lang; }, ALL, FAV, BUILD_DATE,
  add(raw){ const d = normalize(raw); if (DATA.some(x => x.slug === d.slug)) return null; DATA.push(d); refreshAll(); return d; },
  remove(slug){ const i = DATA.findIndex(x => x.slug === slug); if (i < 0) return false; DATA.splice(i, 1); favs.delete(slug); delete prog[slug];
    store.set(LS.favs, [...favs]); store.set(LS.prog, prog); if (cur && cur.slug === slug) closeDrawer(); refreshAll(); return true; },
  clearProgress(){ prog = {}; store.set(LS.prog, prog); if (cur) renderSteps(); },
  clearFavs(){ favs.clear(); store.set(LS.favs, []); if (state.cat === FAV) state.cat = ALL; refreshAll(); if (cur) syncFavBtn(); },
};
(function boot(){
  const p = readHash(); $('q').value = state.q;
  applyView(); applyLang();
  if (p) openDrawer(p);
  window.addEventListener('hashchange', () => {
    const p = readHash(); $('q').value = state.q; renderChips(); render();
    if (p && (!cur || cur.slug !== p)) openDrawer(p); else if (!p && cur) closeDrawer();
  });
})();
</script>
